<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Productivity Buddy helps you plan realistically, track progress, and recover when your day changes.">
  <title>{% block title %}Productivity Buddy{% endblock %}</title>
  <script>
    /* Apply the saved (or system) theme before first paint so there is no flash. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('pb-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%237769df'/%3E%3Cpath d='M20 6.5 23.6 16.4 33.5 20l-9.9 3.6L20 33.5l-3.6-9.9L6.5 20l9.9-3.6z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}

  <div class="toast-stack" id="toastStack" aria-live="polite">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast {{ category }}" role="status"><span class="toast-icon">{{ '✓' if category == 'success' else '!' }}</span><span>{{ message }}</span><button class="toast-close" type="button" aria-label="Dismiss">×</button></div>
      {% endfor %}
    {% endwith %}
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
